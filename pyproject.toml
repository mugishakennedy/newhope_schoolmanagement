[project]
name = "newhope-schoolmanagenment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "bcrypt<5.0.0",
    "fastapi[standard]>=0.143.0",
    "opencode-ai>=0.1.0a36",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[project.scripts]
newhope-schoolmanagenment = "newhope_schoolmanagenment:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
